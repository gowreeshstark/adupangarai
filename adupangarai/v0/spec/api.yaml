openapi: 3.0.0

info:
  title: Adupangarai App
  version: 1.0.0
  description: API documentation for Adupangarai App, an inventory management system.

tags:
  - name: Health
    description: Endpoints related to health checks
  - name: Inventory
    description: Endpoints related to inventory management

paths:
  /item:
    get:
      tags:
        - Inventory
      summary: Get Inventory
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    quantity:
                      type: integer
    post:
      tags:
        - Inventory
      summary: Add Inventory Item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
      responses:
        '201':
          description: Item Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'

  /item/{item_id}:
    get:
      tags:
        - Inventory
      summary: Get Inventory Item by ID
      parameters:
        - in: path
          name: item_id
          schema:
            type: string
          required: true
          description: ID of the item to retrieve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    patch:
      tags:
        - Inventory
      summary: Update Inventory Item
      parameters:
        - in: query
          name: item_id
          schema:
            type: string
          required: true
          description: ID of the item to delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatchRequest'

      responses:
        '200':
          description: Item Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    delete:
      tags:
        - Inventory
      summary: Delete Inventory Item
      parameters:
        - in: query
          name: id
          schema:
            type: UUID
          required: true
          description: ID of the item to delete
      responses:
        '204':
          description: Item Deleted
  /health:
    get:
      tags:
        - Health
      summary: Health Check
      operationId: health_check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
components:
  schemas:
    ItemRequest:
      type: object
      required:
        - name
        - category
        - unit
        - quantity
        - created_by
      properties:
        name:
          type: string
          description: Name of the item
          example: 'Apple'
        category:
          type: enum
          description: Category of the item
          enum: [fruits, vegetables, dairy, groceries, snacks, non-veg]
          example: 'fruits'
        unit:
          type: enum
          description: Unit of measurement
          enum: [count, kg, gram, liters, ml, packet]
          example: 'count'
        quantity:
          type: integer
          description: Quantity of the item
          minimum: 0
          example: 5
        threshold:
          type: integer
          description: Threshold quantity for low stock alert
          minimum: 0
          example: 2
        expiry:
          type: string
          description: Expiry date of the item
          format: date
          example: '2024-12-31'
        enable_alert:
          type: boolean
          description: Whether to enable low stock alert for the item
          example: true
        created_by:
          type: string
          description: User who created the item
          example: 'Shan'
    ItemResponse:
      type: object
      required:
        - id
        - name
        - category
        - unit
        - quantity
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the item
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          description: Name of the item
          example: 'Apple'
        category:
          type: enum
          description: Category of the item
          enum: [fruits, vegetables, dairy, groceries, snacks, non-veg]
          example: 'fruits'
        unit:
          type: enum
          description: Unit of measurement
          enum: [count, kg, gram, liters, ml, packet]
          example: 'count'
        quantity:
          type: integer
          description: Quantity of the item
          minimum: 0
          example: 5
        threshold:
          type: integer
          description: Threshold quantity for low stock alert
          minimum: 0
          example: 2
        expiry:
          type: string
          description: Expiry date of the item
          format: date
          example: '2024-12-31'
        enable_alert:
          type: boolean
          description: Whether to enable low stock alert for the item
          example: true
        created_by:
          type: string
          description: User who created the item
          example: 'Shan'
        created_at:
          type: string
          description: Timestamp when the item was created
          format: date-time
          example: '2024-06-01T12:00:00Z'
        updated_at:
          type: string
          description: Timestamp when the item was last updated
          format: date-time
          example: '2024-06-01T12:00:00Z'
    ItemPatchRequest:
      type: object
      required:
        - created_by
      properties:
        name:
          type: string
          description: Name of the item
          example: 'Apple'
        category:
          type: enum
          description: Category of the item
          enum: [fruits, vegetables, dairy, groceries, snacks, non-veg]
          example: 'fruits'
        unit:
          type: enum
          description: Unit of measurement
          enum: [count, kg, gram, liters, ml, packet]
          example: 'count'
        quantity:
          type: integer
          description: Quantity of the item
          minimum: 0
          example: 5
        threshold:
          type: integer
          description: Threshold quantity for low stock alert
          minimum: 0
          example: 2
        expiry:
          type: string
          description: Expiry date of the item
          format: date
          example: '2024-12-31'
        enable_alert:
          type: boolean
          description: Whether to enable low stock alert for the item
          example: true
        created_by:
          type: string
          description: User who created the item
          example: 'Shan'
